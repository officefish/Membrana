# Trigger Night Hunt on background-office (Fly/VPS) when local PC is off.
# Secrets: OFFICE_URL, OFFICE_API_TOKEN (repository secrets)
#
# FailClosed (вердикт M1 заседания hunt-and-canon, 27.08): отказ обязан выглядеть как
# отказ. Прежняя редакция глушила его ДВАЖДЫ — `continue-on-error: true` на шаге и
# `|| echo "… (optional)"` на команде: офис отвечал 400, прогон был зелёный, охота
# молчала с 12.07 и никто не знал. Масок в этом прогоне быть не должно ни одной.
#
# Отсутствие секретов — единственный законный «пропуск»: это НЕ отказ, а незаведённый
# вход, и он остаётся exit 0 с явной строкой.

name: night-hunt-office-trigger

on:
  schedule:
    - cron: '10 7 * * 1-5'
  workflow_dispatch:

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: POST night-hunt run-all
        env:
          OFFICE_URL: ${{ secrets.OFFICE_URL }}
          OFFICE_API_TOKEN: ${{ secrets.OFFICE_API_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${OFFICE_URL:-}" ] || [ -z "${OFFICE_API_TOKEN:-}" ]; then
            echo "OFFICE_URL or OFFICE_API_TOKEN not set — вход не заведён, запускать нечего"
            exit 0
          fi
          url="${OFFICE_URL%/}/v1/night-hunt/run-all"
          body="$(mktemp)"
          # -f снят намеренно: он прячет тело ответа, а в отказе нужен код И адрес.
          # -d '{}' обязателен (18.09): офис на Fastify отвергает JSON-запрос с пустым телом
          # (HTTP 400 «Body cannot be empty when content-type is set to 'application/json'»)
          # ДО охраны и до обработчика. Дверь run-all тело не читает, поэтому пустой объект —
          # честная форма «без аргументов» и остаётся валидной, если у двери появится схема.
          # Замер без токена: `{}` → 401 (парсер пройден, отказала охрана), пустое тело → 400.
          if ! code="$(curl -sS -o "$body" -w '%{http_code}' -X POST "$url" \
            -H "X-Membrana-Token: ${OFFICE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{}' \
            --max-time 300)"; then
            echo "night-hunt trigger ОТКАЗ: до $url не дозвонились (curl не смог выполнить запрос)"
            exit 1
          fi
          if [ "$code" -lt 200 ] || [ "$code" -ge 300 ]; then
            echo "night-hunt trigger ОТКАЗ: HTTP $code от $url"
            echo "ответ офиса (первые 500 байт):"
            head -c 500 "$body" || true
            exit 1
          fi
          # Второй слой молчания (18.09): дверь отвечает 200 и `ok:true` даже когда каждое дело
          # пропущено — runJob ловит любое исключение и возвращает `skipped:true` с причиной.
          # 2xx без единого выполненного дела — не запуск, а тишина; здесь она становится отказом.
          total="$(jq -r '(.results // []) | length' "$body")"
          done_count="$(jq -r '[(.results // [])[] | select(.skipped != true)] | length' "$body")"
          echo "night-hunt trigger: HTTP $code от $url · дел выполнено $done_count из $total"
          jq -r '(.results // [])[] | "  · \(.id): \(if .skipped == true then "ПРОПУЩЕНО — \(.reason // "без причины")" else (.prUrl // "без PR") end)"' "$body"
          if [ "$total" -eq 0 ] || [ "$done_count" -eq 0 ]; then
            echo "night-hunt trigger ОТКАЗ: офис принял запрос, но ни одно дело не выполнено"
            exit 1
          fi
          echo "night-hunt trigger OK"
