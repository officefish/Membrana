# Еженедельный запуск `yarn plan:week`: читает docs/WHITE_PAPER.md и git log за 7 дней,
# через Anthropic генерирует план следующей недели и приносит docs/STRATEGIC_PLAN_WEEK.md
# в main ЗАЯВКОЙ (отдельная ветка bot/weekly-plan-<run_id> + PR), а не пушем.
#
# Почему не пушем (шаг 0.3 docs/strategy/RETURN_STRATEGY_2026-11.md): main защищена —
# 3 обязательные проверки (scan, «Lint, typecheck, test, build», review/teamlead). Прежний
# шаг делал `git push origin HEAD:main` и с 28.09 каждую неделю падал на GH006: план
# генерировался и выбрасывался. Права на прямой пуш боту НЕ даются — защита остаётся целой.
#
# Обязательные проверки у заявки бота: PR, открытый под GITHUB_TOKEN, НЕ запускает
# pull_request-прогоны (правило GitHub против рекурсии). Чтобы заявка получила scan и
# «Lint, typecheck, test, build», человек закрывает и переоткрывает её (или пушит в ветку
# свой коммит) — события идут уже от человека, и CI стартует; review/teamlead — как у
# любой заявки: `yarn review:gate --pr <N> --ensure --publish`. Отдельного токена/приложения
# для Actions в репозитории нет (ночные PR охоты создаёт офис под токеном владельца).
#
# Предусловие: Settings → Actions → General → «Allow GitHub Actions to create and approve
# pull requests» включено, иначе `gh pr create` откажет (шаг падает громко; ветка с планом
# к этому моменту уже лежит в origin, план не теряется).
#
# Расписание: понедельник 07:00 UTC — после того, как `Scheduled CI` проверил здоровье main (06:00 UTC).
# Ручной запуск: вкладка Actions → Weekly strategic plan → Run workflow.
#
# Требуется секрет ANTHROPIC_API_KEY в Settings → Secrets and variables → Actions.
# Опционально: vars.ANTHROPIC_MODEL для переопределения модели (см. .env.example).

name: Weekly strategic plan

on:
  schedule:
    - cron: '0 7 * * 1'
  workflow_dispatch:
    inputs:
      since:
        description: 'Период для git log (например "7 days ago", "2 weeks ago"). Пусто = по умолчанию.'
        required: false
        default: ''
      full:
        description: 'Добавить --shortstat в git log.'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

concurrency:
  group: weekly-strategic-plan
  cancel-in-progress: false

permissions:
  contents: write # push ветки bot/weekly-plan-* (не main: main защищена)
  pull-requests: write # gh pr create

jobs:
  plan-week:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # `_strategic-plan.mjs` зовёт `git log --since="7 days ago"` —
          # с дефолтным fetch-depth: 1 это вернуло бы один коммит. Нужна полная история.
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Enable Corepack (Yarn 4)
        run: |
          corepack enable
          corepack prepare yarn@4.5.0 --activate
          echo "YARN_CACHE_FOLDER=$(yarn config get cacheFolder)" >> "$GITHUB_ENV"

      - name: Yarn Berry cache
        uses: actions/cache@v4
        with:
          path: ${{ env.YARN_CACHE_FOLDER }}
          key: ${{ runner.os }}-yarn-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Install dependencies
        run: yarn install --immutable

      - name: Verify ANTHROPIC_API_KEY
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "${ANTHROPIC_API_KEY}" ]; then
            echo "::error::Секрет ANTHROPIC_API_KEY не задан. Добавьте в Settings → Secrets and variables → Actions → New repository secret."
            exit 1
          fi

      - name: Generate weekly strategic plan
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
          PLAN_SINCE: ${{ inputs.since }}
          PLAN_FULL: ${{ inputs.full }}
        run: |
          set -euo pipefail
          ARGS=()
          if [ -n "${PLAN_SINCE:-}" ]; then
            ARGS+=("--since=${PLAN_SINCE}")
          fi
          if [ "${PLAN_FULL:-}" = "true" ]; then
            ARGS+=("--full")
          fi
          node scripts/strategic-plan-week.mjs "${ARGS[@]}"

      - name: Open PR with the plan if changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain docs/STRATEGIC_PLAN_WEEK.md)" ]; then
            echo "Файл docs/STRATEGIC_PLAN_WEEK.md не изменился — заявлять нечего."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          day="$(date -u +%Y-%m-%d)"
          branch="bot/weekly-plan-${GITHUB_RUN_ID}"
          git switch -c "$branch"
          git add docs/STRATEGIC_PLAN_WEEK.md
          # Без [skip ci]: заявке нужны обязательные проверки, а не их подавление.
          git commit -m "docs(plan): еженедельный стратегический план ${day}"
          # Пуш ТОЛЬКО в собственную новую ветку; защищённая main этим шагом не трогается.
          git push origin "HEAD:refs/heads/${branch}"
          body="$(mktemp)"
          {
            echo "Еженедельный стратегический план (\`yarn plan:week\`), прогон ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}."
            echo ""
            echo "Заявка открыта ботом под GITHUB_TOKEN — CI сам НЕ стартует."
            echo "Обязательные проверки: закрыть и переоткрыть заявку (scan, «Lint, typecheck, test, build»),"
            echo "затем \`yarn review:gate --pr <N> --ensure --publish\` (review/teamlead)."
          } > "$body"
          if ! url="$(gh pr create --base main --head "$branch" \
            --title "docs(plan): еженедельный стратегический план ${day}" \
            --body-file "$body")"; then
            echo "::error::Ветка ${branch} запушена, но PR не создан. Проверьте Settings → Actions → General → «Allow GitHub Actions to create and approve pull requests»."
            exit 1
          fi
          echo "PR: ${url}"
          echo "PLAN_PR=${url}" >> "$GITHUB_ENV"

      - name: Job summary
        if: always()
        run: |
          {
            echo "## Weekly strategic plan"
            echo ""
            echo "- Скрипт: \`yarn plan:week\` (см. \`scripts/strategic-plan-week.mjs\`)."
            echo "- Источник цели: \`docs/WHITE_PAPER.md\`."
            echo "- Период: последние 7 дней (если не переопределён через \`since\`)."
            echo "- Выход: \`docs/STRATEGIC_PLAN_WEEK.md\`."
            if [ -n "${PLAN_PR:-}" ]; then
              echo "- Результат: заявка ${PLAN_PR} (CI — переоткрытием, см. тело PR)."
            else
              echo "- Результат: изменений не было или генерация не дошла до заявки."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
