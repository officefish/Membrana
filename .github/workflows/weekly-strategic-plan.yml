# Еженедельный запуск `yarn plan:week`: читает docs/WHITE_PAPER.md и git log за 7 дней,
# через Anthropic генерирует план следующей недели и приносит docs/STRATEGIC_PLAN_WEEK.md
# в main ЗАЯВКОЙ (отдельная ветка bot/weekly-plan-<run_id> + PR), а не пушем.
#
# Почему не пушем (шаг 0.3 docs/strategy/RETURN_STRATEGY_2026-11.md): main защищена —
# 3 обязательные проверки (scan, «Lint, typecheck, test, build», review/teamlead). Прежний
# шаг делал `git push origin HEAD:main` и с 28.09 каждую неделю падал на GH006: план
# генерировался и выбрасывался. Права на прямой пуш боту НЕ даются — защита остаётся целой.
#
# Обязательные проверки у заявки бота: пуш и PR, сделанные под GITHUB_TOKEN, НЕ запускают
# push/pull_request-прогоны (правило GitHub против рекурсии). Поэтому ветка пушится и PR
# открывается под секретом WEEKLY_PLAN_TOKEN (fine-grained PAT владельца: Contents RW +
# Pull requests RW, заведён 18.11) — события идут от владельца токена, scan и
# «Lint, typecheck, test, build» стартуют сами, переоткрывать заявку больше НЕ нужно.
# review/teamlead — как у любой заявки: `yarn review:gate --pr <N> --ensure --publish`.
#
# Фолбэк: секрета нет (форк, удалён) — работаем под GITHUB_TOKEN, как раньше; заявка
# создаётся, но CI сам не стартует — об этом строка в Summary и в теле PR (тогда закрыть
# и переоткрыть заявку руками). Истёкший/отозванный PAT при НЕпустом секрете фолбэком не
# ловится: checkout или push упадут громко — продлить токен.
#
# Для фолбэка нужно Settings → Actions → General → «Allow GitHub Actions to create and
# approve pull requests» (включено 18.11), иначе `gh pr create` под GITHUB_TOKEN откажет
# (шаг падает громко; ветка с планом к этому моменту уже в origin, план не теряется).
#
# Расписание: понедельник 07:00 UTC — после того, как `Scheduled CI` проверил здоровье main (06:00 UTC).
# Ручной запуск: вкладка Actions → Weekly strategic plan → Run workflow.
#
# Требуется секрет ANTHROPIC_API_KEY в Settings → Secrets and variables → Actions.
# Опционально: vars.ANTHROPIC_MODEL для переопределения модели (см. .env.example).

name: Weekly strategic plan

on:
  schedule:
    - cron: '0 7 * * 1'
  workflow_dispatch:
    inputs:
      since:
        description: 'Период для git log (например "7 days ago", "2 weeks ago"). Пусто = по умолчанию.'
        required: false
        default: ''
      full:
        description: 'Добавить --shortstat в git log.'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

concurrency:
  group: weekly-strategic-plan
  cancel-in-progress: false

permissions:
  contents: write # фолбэк GITHUB_TOKEN: push ветки bot/weekly-plan-* (не main: main защищена)
  pull-requests: write # фолбэк GITHUB_TOKEN: gh pr create

jobs:
  plan-week:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Resolve PR token
        env:
          WEEKLY_PLAN_TOKEN: ${{ secrets.WEEKLY_PLAN_TOKEN }}
        run: |
          # Секрет нельзя проверить в `if:` — проверяем значение в окружении шага.
          if [ -n "${WEEKLY_PLAN_TOKEN:-}" ]; then
            echo "PLAN_TOKEN_SOURCE=WEEKLY_PLAN_TOKEN" >> "$GITHUB_ENV"
          else
            echo "::warning::Секрет WEEKLY_PLAN_TOKEN не задан — фолбэк на GITHUB_TOKEN: заявка CI сама не запустит."
            echo "PLAN_TOKEN_SOURCE=GITHUB_TOKEN" >> "$GITHUB_ENV"
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          # `_strategic-plan.mjs` зовёт `git log --since="7 days ago"` —
          # с дефолтным fetch-depth: 1 это вернуло бы один коммит. Нужна полная история.
          fetch-depth: 0
          # Токен checkout сохраняется в git-конфиге, им же идёт `git push` ветки:
          # пуш под PAT запускает push-прогоны, под GITHUB_TOKEN — нет.
          token: ${{ secrets.WEEKLY_PLAN_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Enable Corepack (Yarn 4)
        run: |
          corepack enable
          corepack prepare yarn@4.5.0 --activate
          echo "YARN_CACHE_FOLDER=$(yarn config get cacheFolder)" >> "$GITHUB_ENV"

      - name: Yarn Berry cache
        uses: actions/cache@v4
        with:
          path: ${{ env.YARN_CACHE_FOLDER }}
          key: ${{ runner.os }}-yarn-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Install dependencies
        run: yarn install --immutable

      - name: Verify ANTHROPIC_API_KEY
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "${ANTHROPIC_API_KEY}" ]; then
            echo "::error::Секрет ANTHROPIC_API_KEY не задан. Добавьте в Settings → Secrets and variables → Actions → New repository secret."
            exit 1
          fi

      - name: Generate weekly strategic plan
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
          PLAN_SINCE: ${{ inputs.since }}
          PLAN_FULL: ${{ inputs.full }}
        run: |
          set -euo pipefail
          ARGS=()
          if [ -n "${PLAN_SINCE:-}" ]; then
            ARGS+=("--since=${PLAN_SINCE}")
          fi
          if [ "${PLAN_FULL:-}" = "true" ]; then
            ARGS+=("--full")
          fi
          node scripts/strategic-plan-week.mjs "${ARGS[@]}"

      - name: Open PR with the plan if changed
        env:
          # PR под PAT сам запускает pull_request-прогоны (обязательные проверки).
          GH_TOKEN: ${{ secrets.WEEKLY_PLAN_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain docs/STRATEGIC_PLAN_WEEK.md)" ]; then
            echo "Файл docs/STRATEGIC_PLAN_WEEK.md не изменился — заявлять нечего."
            echo "PLAN_STATE=unchanged" >> "$GITHUB_ENV"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          day="$(date -u +%Y-%m-%d)"
          branch="bot/weekly-plan-${GITHUB_RUN_ID}"
          git switch -c "$branch"
          git add docs/STRATEGIC_PLAN_WEEK.md
          # Без [skip ci]: заявке нужны обязательные проверки, а не их подавление.
          git commit -m "docs(plan): еженедельный стратегический план ${day}"
          # Пуш ТОЛЬКО в собственную новую ветку; защищённая main этим шагом не трогается.
          git push origin "HEAD:refs/heads/${branch}"
          body="$(mktemp)"
          trap 'rm -f "$body"' EXIT
          {
            echo "Еженедельный стратегический план (\`yarn plan:week\`), прогон ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}."
            echo ""
            if [ "${PLAN_TOKEN_SOURCE:-}" = "WEEKLY_PLAN_TOKEN" ]; then
              echo "Заявка открыта под WEEKLY_PLAN_TOKEN — scan и «Lint, typecheck, test, build» стартуют сами."
            else
              echo "Заявка открыта под GITHUB_TOKEN (секрета WEEKLY_PLAN_TOKEN нет) — CI сам НЕ стартует:"
              echo "закрыть и переоткрыть заявку (scan, «Lint, typecheck, test, build»)."
            fi
            echo "review/teamlead: \`yarn review:gate --pr <N> --ensure --publish\`."
          } > "$body"
          if ! url="$(gh pr create --base main --head "$branch" \
            --title "docs(plan): еженедельный стратегический план ${day}" \
            --body-file "$body")"; then
            echo "::error::Ветка ${branch} запушена, но PR не создан. Проверьте Settings → Actions → General → «Allow GitHub Actions to create and approve pull requests»."
            echo "PLAN_STATE=pr-failed" >> "$GITHUB_ENV"
            # Ветка остаётся НАМЕРЕННО: в ней сгенерированный план, без неё он потерян.
            # Уборка осиротевших bot/weekly-plan-* — follow-up #2650.
            exit 1
          fi
          echo "PR: ${url}"
          echo "PLAN_PR=${url}" >> "$GITHUB_ENV"

      - name: Job summary
        if: always()
        run: |
          {
            echo "## Weekly strategic plan"
            echo ""
            echo "- Скрипт: \`yarn plan:week\` (см. \`scripts/strategic-plan-week.mjs\`)."
            echo "- Источник цели: \`docs/WHITE_PAPER.md\`."
            echo "- Период: последние 7 дней (если не переопределён через \`since\`)."
            echo "- Выход: \`docs/STRATEGIC_PLAN_WEEK.md\`."
            if [ "${PLAN_TOKEN_SOURCE:-}" = "GITHUB_TOKEN" ]; then
              echo "- Токен: ФОЛБЭК на GITHUB_TOKEN — секрет WEEKLY_PLAN_TOKEN не задан; PR бота обязательные проверки сам не запустит."
            else
              echo "- Токен: ${PLAN_TOKEN_SOURCE:-не определён (шаг Resolve PR token не дошёл)}."
            fi
            if [ -n "${PLAN_PR:-}" ]; then
              if [ "${PLAN_TOKEN_SOURCE:-}" = "WEEKLY_PLAN_TOKEN" ]; then
                echo "- Результат: заявка ${PLAN_PR} (под WEEKLY_PLAN_TOKEN — CI стартует сам)."
              else
                echo "- Результат: заявка ${PLAN_PR} (под GITHUB_TOKEN — CI сам не стартует, переоткрыть заявку)."
              fi
            elif [ "${PLAN_STATE:-}" = "unchanged" ]; then
              echo "- Результат: план не изменился — заявка не нужна."
            elif [ "${PLAN_STATE:-}" = "pr-failed" ]; then
              echo "- Результат: ОТКАЗ — ветка с планом запушена, PR не создан (см. ошибку шага; уборка ветки — #2650)."
            else
              echo "- Результат: генерация не дошла до заявки (см. упавший шаг выше)."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
