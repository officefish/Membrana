# Ежедневный цикл: каждый push в основные ветки и каждый PR проходят одну и ту же проверку,
# что соответствует ролям «Структурщик» / Teamlead из docs/VIRTUAL_TEAM_PROMPT.md (границы пакетов, сборка).

name: CI

on:
  push:
    branches: [main, master, develop, vesnin, u10-workspace-prod]
    # Контур communications (Вариант A) имеет свою полосу (comms-studio.yml);
    # правка ТОЛЬКО его путей не гоняет продуктовый pipeline. CC3.
    paths-ignore:
      - 'apps/comms-studio/**'
      - 'docs/comms/**'
  pull_request:
    branches: [main, master, develop, vesnin, u10-workspace-prod]
    paths-ignore:
      - 'apps/comms-studio/**'
      - 'docs/comms/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Stub for prisma generate in background-* packages (no live DB in CI).
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Мердж-гейт корпуса vitest считает изменённые файлы через merge-base.
          # На мелкой выкачке (depth 1) базы просто нет, и гейт отказал бы кодом 2
          # («проверки не было») — что честно, но бесполезно.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Не использовать cache: yarn в setup-node — на раннере это Yarn 1 и ломает шаг до Corepack.
      - name: Enable Corepack (Yarn 4 из packageManager)
        run: |
          corepack enable
          corepack prepare yarn@4.5.0 --activate
          echo "YARN_CACHE_FOLDER=$(yarn config get cacheFolder)" >> "$GITHUB_ENV"

      - name: Yarn Berry cache
        uses: actions/cache@v4
        with:
          path: ${{ env.YARN_CACHE_FOLDER }}
          key: ${{ runner.os }}-yarn-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Install dependencies
        run: yarn install --immutable

      - name: Root scripts — политика путей и инварианты скриптов
        run: yarn test:scripts

      - name: Мастерские — контракт, принадлежность, свежесть атласа (HOME_WORKSHOP)
        run: yarn validate:workshop && yarn check:workshop-ownership && yarn check:workshop-dependencies && yarn tooling:atlas --check

      # Строгий режим описей китов (PINNED_SUBGRAPH / #1196): подграф корней обязан
      # совпадать с pins. Локальный pre-push гоняет мягкий latest — здесь барьер.
      - name: Киты — описи совпадают с подграфом корней (pinned)
        run: yarn kits:audit

      # Dual Mintlify (W2): product + harness docs.json / MDX navigation — CI-safe, no Mintlify CLI.
      - name: Docs — verify both Mintlify roots (product + harness)
        run: yarn docs:verify:all

      - name: Catalog — verify client module/plugin prompts
        run: yarn catalog:verify-client

      - name: Turbo — lint, typecheck, build
        run: yarn turbo run lint typecheck build --continue

      # Ярус smoke — вычисляемый список, а не рукопись: каталог обязан совпадать с графом
      # воркспейса, иначе гейт опирается на устаревшую опись.
      - name: Vitest — каталог smoke согласован с графом воркспейса
        run: yarn vitest:smoke-list --check

      # Мердж-гейт корпуса vitest (cg2): затронутые пакеты с зависимыми плюс ярус smoke.
      # Полный корпус — ночью (vitest-nightly.yml) и в недельном scheduled-ci.
      #
      # Шаг ОБЯЗАН печатать «что не гонялось» — это условие честности ADR-0018, а не
      # удобство: без отчёта выборочный гейт узаконивает молчаливое сужение набора
      # (26.07: 11 тестов в scripts/lib/** — 81 проверка — не гонялись недели, и зелёный
      # выглядел полным). Отчёт уходит в job summary.
      - name: Vitest — мердж-гейт (затронутое + smoke) и отчёт «что не гонялось»
        run: yarn vitest:gate --base ${{ github.event.pull_request.base.sha || 'HEAD^1' }}

      - name: RAG — acceptance tests (keyword corpus I/O, timeout 30 s/тест)
        if: always()
        run: yarn workspace @membrana/rag-service test:acceptance

      - name: Harmonic — integration test (FFT processing, timeout 10 s)
        if: always()
        # Через turbo: dependsOn ["^build"] гарантирует dist @membrana/detector-base
        # до теста (cg5 — устраняет флейки "Failed to resolve entry"). Не прямой yarn.
        run: yarn turbo run test:integration --filter=@membrana/harmonic-detector-service

      - name: Script ritual tests (test:scripts)
        run: yarn test:scripts

      - name: Job summary
        if: always()
        run: |
          {
            echo "## CI (Membrana)"
            echo ""
            echo "- Менеджер пакетов: **Yarn 4** (\`packageManager\` в корневом \`package.json\`)."
            echo "- Команда: \`yarn turbo run lint typecheck test build\`."
            echo ""
            echo "Перед PR локально выполните то же самое (см. \`docs/CONTRIBUTING.md\`)."
            echo ""
            echo "### Виртуальная команда"
            echo "Чеклист ролей и документов: workflow **Virtual team context** (\`.github/workflows/virtual-team-context.yml\`)."
          } >> "$GITHUB_STEP_SUMMARY"
