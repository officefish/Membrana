# Ночной полный прогон tests-container от пина (#1293, эпик tests-container).
#
# Решения владельца 26.07: полные прогоны ночные; адресат красного — вход утреннего
# ритуала как блокер дня (кадр night-report процедуры ritual-day), не почта; ночь на
# main по расписанию «только после защиты main» — предусловие выполнено (required
# checks на main стоят с 08.2026), поэтому schedule включён. Живые ветки — только
# workflow_dispatch.
#
# Носитель: tests/reports/nightly-full/latest.{json,md} — уезжает артефактом
# `nightly-full-report`; утро подтягивает его `yarn night-report:gate --pull` и
# читает локально (дом tests/reports/nightly-full/ в .gitignore). Красный прогона
# виден и здесь, но БЛОКЕР living в утре: morning-care исполняет blocksMorningWhen.
#
# Сосед: vitest-nightly.yml (02:00 UTC) — корпус vitest воркспейсов; здесь —
# node --test набор tests-container от pinned-аудита кита tests-master. Разные
# предметы, каденция сдвинута, чтобы не толкаться.
name: Tests nightly full (container, pinned)

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

concurrency:
  group: tests-nightly-full-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  full:
    name: tests:nightly-full — полный набор от пина
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Enable Corepack (Yarn 4)
        run: |
          corepack enable
          corepack prepare yarn@4.5.0 --activate

      - name: Install dependencies
        run: yarn install --immutable

      - name: Полный набор от пина (kits/tests-master pinned)
        run: yarn tests:nightly-full

      # Красный не должен прятать носитель: отчёт уезжает и при падении — именно
      # красный отчёт утро обязано увидеть и разобрать (#1293, решение 2).
      - name: Носитель кадра night-report — артефакт
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-full-report
          path: tests/reports/nightly-full/
          if-no-files-found: error
          retention-days: 14

      - name: Job summary
        if: always()
        run: |
          if [ -f tests/reports/nightly-full/latest.md ]; then
            cat tests/reports/nightly-full/latest.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Носитель не записан — прогон упал до writeNightlyFullReport." >> "$GITHUB_STEP_SUMMARY"
          fi
