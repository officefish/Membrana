# Секрет-скан репозитория (лист №5 заседания security-posture, 19.07.2026).
# Baseline ложных срабатываний — .gitleaksignore (проверены вручную).
#
# ДВА РЕЖИМА (#1262, инцидент 26.07):
#   pull_request → скан ДИАПАЗОНА заявки (base..HEAD). Раньше здесь шёл `detect --source .`
#     при `fetch-depth: 0`, то есть по истории ВСЕХ ветвей: находка в чужой ветке красила
#     заявку, в которой её коммита нет. 26.07 так встала работа соседней сессии — синтетическая
#     PEM-фикстура из ветки резака секретов блокировала ЛЮБУЮ заявку, пока ветка жила в origin.
#   push: main → полный скан истории. Гарантия «в репозитории нет живых секретов» остаётся,
#     но её нарушение указывает на main, а не на невиновную заявку.
name: gitleaks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.21.2
        run: |
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          ./gitleaks version

      - name: Scan PR range
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          echo "диапазон заявки: $BASE_SHA..$HEAD_SHA"
          ./gitleaks detect --source . --no-banner --redact -v --log-opts="$BASE_SHA..$HEAD_SHA"

      - name: Scan full history
        if: github.event_name != 'pull_request'
        run: ./gitleaks detect --source . --no-banner --redact -v
